:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F4F2; --card:#FFFFFF; --ink:#1E2328; --muted:#626A70; --line:#DDE0DC;
  --campo:#F7F8F6;
  --tes:#56666F; --min:#9A6D12; --vid:#842A31;
  --tes-t:#46565F; --min-t:#8A600C; --vid-t:#842A31;
  --hl:#FFF4CF; --mark:#FFE08A; --foco:#2F6FB3;
  --c-ms:#842A31; --c-fs:#2F6F82; --c-av:#B58124; --c-in:#3E7D52; --c-dc:#3D5A99; --c-lp:#5B6672; --c-rm:#7A4A78;

  --serif:'Literata',Georgia,'Times New Roman',serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181B; --card:#1D2125; --ink:#ECEEEC; --muted:#A1A8AD; --line:#30363B; --campo:#23282D;
    --tes-t:#A9B9C2; --min-t:#E0B55A; --vid-t:#E48A91;
    --hl:rgba(224,181,90,.14); --mark:rgba(224,181,90,.42); --foco:#7FB2E8; --verde:#4FBE7A;

}
:root[data-theme="dark"]{
  --bg:#15181B; --card:#1D2125; --ink:#ECEEEC; --muted:#A1A8AD; --line:#30363B; --campo:#23282D;
  --tes-t:#A9B9C2; --min-t:#E0B55A; --vid-t:#E48A91;
  --hl:rgba(224,181,90,.14); --mark:rgba(224,181,90,.42); --foco:#7FB2E8; --verde:#4FBE7A;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}

<body>

<header class="topo">
  <div class="in">
    <div class="faixas" aria-hidden="true"><i style="background:var(--tes)"></i><i style="background:var(--min)"></i><i style="background:var(--vid)"></i></div>
    <div class="marca">
      <strong id="t-titulo">Programação da congregação</strong>
      <span id="t-sub">Escalas e designações</span>
    </div>
    <div id="topo-usuario" style="display:flex;align-items:center;gap:8px;flex:none"></div>
  </div>
</header>

<main id="app"></main>
<footer><a id="troca" href="#admin">Área do administrador</a></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   Camada de dados
   R3: dados de exemplo iniciais que já viraram a planilha do
   Google (a fonte de dados de verdade agora é a API_URL, logo
   abaixo). Este objeto fica só de referência do formato.
   Toda designação (pessoa) vem do cadastro DB.pessoas.
   ============================================================ */
const SECOES = { T:'Tesouros da Palavra de Deus', M:'Faça seu melhor no ministério', V:'Nossa vida cristã' };
const TIPOS = ['', 'Estudante', 'Estudante/ajudante', 'Dirigente/leitor'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const HUB_DEFS = [
  { key:'ms', titulo:'Reunião de meio de semana', cor:'var(--c-ms)' },
  { key:'fs', titulo:'Reunião de fim de semana', cor:'var(--c-fs)' },
  { key:'dc', titulo:'Dirigentes de campo', cor:'var(--c-dc)' },
  { key:'av', titulo:'Áudio, vídeo e volantes', cor:'var(--c-av)' },
  { key:'in', titulo:'Indicadores', cor:'var(--c-in)' },
  { key:'lp', titulo:'Limpeza semanal e periódica', cor:'var(--c-lp)' },
  { key:'rm', titulo:'Entrega de relatórios mensais', cor:'var(--c-rm)' }
];
const NOMES_MOD = Object.fromEntries(HUB_DEFS.map(h => [h.key, h.titulo]));

const MODULOS_SIMPLES = {
  fs: { titulo:'Reunião de fim de semana', tabela:'fimDeSemana', campos:[
        { k:'presidente', label:'Presidente', tipo:'pessoa', flag:'podePresidente' }, { k:'leitor', label:'Leitor de A Sentinela', tipo:'pessoa', flag:'podeLeitorSentinela' } ] },
  av: { titulo:'Áudio, vídeo e volantes', tabela:'multimidia', comDiaSemana:true, campos:[
        { k:'mesa', label:'Mesa (multimídia)', tipo:'pessoa', flag:'podeMesa' }, { k:'volante1', label:'Volante 1', tipo:'pessoa', flag:'podeVolante' }, { k:'volante2', label:'Volante 2', tipo:'pessoa', flag:'podeVolante' } ] },
  in: { titulo:'Indicadores', tabela:'indicadores', comDiaSemana:true, campos:[
        { k:'indicador1', label:'Indicador 1', tipo:'pessoa', flag:'podeIndicador' }, { k:'indicador2', label:'Indicador 2', tipo:'pessoa', flag:'podeIndicador' } ] },
  dc: { titulo:'Dirigentes de campo', tabela:'dirigentesCampo', comDiaSemana:true, campos:[
        { k:'nome', label:'Dirigente de campo', tipo:'pessoa', flag:'podePresidente' } ] }
};

const p = (secao, titulo, min, tipo, nome, ajudante='') => ({ secao, titulo, min, tipo, nome, ajudante });
const MODELO_PARTES_MS = [
  p('T','',10,'',''), p('T','Joias espirituais',10,'',''), p('T','Leitura da Bíblia',4,'Estudante',''),
  p('M','Iniciando conversas',3,'Estudante/ajudante',''), p('M','Cultivando interesse',4,'Estudante/ajudante',''),
  p('M','Explicando suas crenças',5,'Estudante/ajudante',''),
  p('V','',15,'',''), p('V','Estudo bíblico de congregação',30,'Dirigente/leitor','')
];

/* ============================================================
   R3: a base agora é a planilha do Google, via Apps Script.
   API_URL é o endereço /exec da implantação como App da Web.
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzoQVkhtO5kkUWjY82tU771KC2S6f9kaPEbq4l09nZ_KvUkOIDbchg50eM7DbRjYTU-/exec';

const Dados = {
  // Leitura pública via JSONP — contorna o bloqueio de CORS.
  // O servidor recebe ?callback=_cb e responde: _cb({"ok":true,"dados":{...}})
  async carregar(){
    return new Promise((resolve, reject) => {
      const nome = '_cb' + Date.now();
      const script = document.createElement('script');
      const timer = setTimeout(() => {
        cleanup(); reject(new Error('A planilha demorou demais. Tente de novo — a primeira abertura pode ser mais lenta.'));
      }, 45000);
      function cleanup(){ delete window[nome]; script.remove(); clearTimeout(timer); }
      window[nome] = data => {
        cleanup();
        if (data && data.ok) resolve(data.dados);
        else reject(new Error((data && data.erro) || 'Resposta inválida da planilha.'));
      };
      script.src = API_URL + '?callback=' + nome;
      script.onerror = () => { cleanup(); reject(new Error('Não foi possível alcançar a planilha.')); };
      document.head.appendChild(script);
    });
  },
  // Grava o estado atual de DB. O servidor confere o PIN de novo e só grava
  // as abas do escopo daquele PIN, mesmo que DB tenha outras áreas juntas.
  async salvar(){
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita pre-flight de CORS
      body: JSON.stringify({ acao:'salvar', pin: st.pin, dados: DB })
    });
    const json = await resp.json();
    if (!json.ok) throw new Error(json.erro || 'Erro ao salvar.');
    DB = json.dados; // adota a versão mais recente vinda da planilha
    return true;
  },
  // Envio de relatório mensal: não pede PIN, só grava/atualiza uma linha.
  async enviarRelatorio(registro){
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao:'relatorio', registro })
    });
    const json = await resp.json();
    if (!json.ok) throw new Error(json.erro || 'Erro ao enviar relatório.');
    return json.id;
  }
};

/* ============================================================ utilidades gerais */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const paraData = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const paraIso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const somaDias = (iso, n) => { const d = paraData(iso); d.setDate(d.getDate()+n); return paraIso(d); };
const hojeIso = () => paraIso(new Date());
const dataCurta = iso => { const d = paraData(iso); return `${String(d.getDate()).padStart(2,'0')} ${MESES[d.getMonth()].slice(0,3)}`; };
const DIAS_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const diaSemana = iso => DIAS_SEMANA[paraData(iso).getDay()];
const dataDDMMAAAA = iso => { const d = paraData(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
const mesAnoLegivel = mA => { if (!mA) return ''; const [y,m] = mA.split('-').map(Number); return `${MESES[m-1]} de ${y}`; };
const mesAtualISO = () => { const h = new Date(); return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}`; };

function rotuloLongo(w){
  const a = paraData(w.inicio), b = paraData(w.fim);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()} a ${b.getDate()} de ${MESES[b.getMonth()]}`
    : `${a.getDate()} de ${MESES[a.getMonth()]} a ${b.getDate()} de ${MESES[b.getMonth()]}`;
}
function rotuloCurto(w){
  const a = paraData(w.inicio), b = paraData(w.fim);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()} ${MESES[b.getMonth()].slice(0,3)}`
    : `${a.getDate()} ${MESES[a.getMonth()].slice(0,3)}–${b.getDate()} ${MESES[b.getMonth()].slice(0,3)}`;
}
const ehSemanaAtual = w => w.inicio <= hojeIso() && hojeIso() <= w.fim;

/* "Osmar L." casa com "Osmar Leandro" — segue útil na busca por nome */
function casa(nome, filtro){
  const n = norm(nome), f = norm(filtro);
  if (!n || f.length < 2) return false;
  if (n.includes(f)) return true;
  const tn = n.split(/[\s.]+/).filter(Boolean), tf = f.split(/[\s.]+/).filter(Boolean);
  if (tn[0] !== tf[0]) return false;
  if (!tn[1] || !tf[1]) return false;
  return tn[1].startsWith(tf[1]) || tf[1].startsWith(tn[1]);
}

const ordenadas = () => [...DB.semanasMS].sort((a,b) => a.inicio.localeCompare(b.inicio));
const partesOrd = w => ['T','M','V'].flatMap(s => w.partes.filter(x => x.secao === s));
function semanaPadrao(ws){
  const h = hojeIso();
  return (ws.find(ehSemanaAtual) || ws.find(w => w.inicio > h) || ws[ws.length-1]).id;
}
const statusPeriodica = data => (data && data < hojeIso()) ? 'Concluído' : 'Programado';
function idAtualPorCampo(linhas, campo){
  if (!linhas.length) return null;
  const h = hojeIso();
  const fut = linhas.filter(x => x[campo] >= h).sort((a,b) => a[campo].localeCompare(b[campo]))[0];
  return fut ? fut[campo] : linhas[linhas.length-1][campo];
}

/* -------- cadastro de publicadores: fonte única de nomes e grupos para todo o app */
function nomesFiltrados(flag){
  return DB.pessoas.filter(x => !flag || x[flag]).map(x => x.nome).filter(Boolean).sort((a,b) => a.localeCompare(b,'pt-BR'));
}
function todasPessoas(){ return nomesFiltrados(null); }
function gruposUnicos(){ return [...new Set(DB.pessoas.map(x => x.grupo).filter(Boolean))].sort((a,b) => a.localeCompare(b,'pt-BR')); }
function opcoesPessoasComRotulo(rotuloVazio, selecionado, flag){
  return `<option value="">${esc(rotuloVazio)}</option>` + nomesFiltrados(flag).map(n => `<option value="${esc(n)}" ${n===selecionado?'selected':''}>${esc(n)}</option>`).join('');
}
const opcoesPessoas = (selecionado, flag) => opcoesPessoasComRotulo('— a definir —', selecionado, flag);
function opcoesGrupos(selecionado){
  return '<option value="">— a definir —</option>' + gruposUnicos().map(g => `<option value="${esc(g)}" ${g===selecionado?'selected':''}>${esc(g)}</option>`).join('');
}
function avisoSemPessoas(){
  return DB.pessoas.length ? '' : '<div class="aviso"><b>Nenhum publicador cadastrado.</b> Cadastre em <a href="#admin:pessoas">Cadastro de publicadores</a> antes de montar as escalas.</div>';
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}
function sessaoEscopo(v){
  try {
    if (v === undefined) return sessionStorage.getItem('reuniao-cong-escopo') || '';
    v ? sessionStorage.setItem('reuniao-cong-escopo', v) : sessionStorage.removeItem('reuniao-cong-escopo');
  } catch(e){}
  return v;
}
function sessaoPin(v){

    if (v === undefined) return sessionStorage.getItem('reuniao-cong-pin') || '';
    v ? sessionStorage.setItem('reuniao-cong-pin', v) : sessionStorage.removeItem('reuniao-cong-pin');
  } catch(e){}
  return v;
}
function sessaoUsuario(v){
  try {
    if (v === undefined) return sessionStorage.getItem('reuniao-cong-usuario') || '';
    v ? sessionStorage.setItem('reuniao-cong-usuario', v) : sessionStorage.removeItem('reuniao-cong-usuario');
  } catch(e){}
  return v;
}
// Hash SHA-256 do PIN — o valor gravado na planilha nunca é o PIN em texto puro
async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(pin).trim()));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function checarPinUsuario(nome, pin){
  if (!nome || !pin) return false;
  const p = DB.pessoas.find(x => x.nome === nome);
  if (!p) return false;
  // PIN inicial (texto puro — comparação direta, só usado uma vez)
  if (p.pinInicial && String(p.pinInicial).trim() === String(pin).trim()) return 'primeiro';
  // PIN pessoal (hash — comparação acontece de forma assíncrona, ver case de login)
  return 'verificar';
}
function checarPin(pin){
  pin = (pin||'').trim(); if (!pin) return '';
  if (pin === DB.config.pinMestre) return 'todos';
  for (const h of HUB_DEFS) if (DB.config.pins[h.key] && pin === DB.config.pins[h.key]) return h.key;
  return '';
}

function parseHash(){
  const h = (location.hash || '').slice(1);
  if (!h) return { area:'hub', mod:null };
  const i = h.indexOf(':');
  const area = i < 0 ? h : h.slice(0,i);
  const mod = i < 0 ? null : h.slice(i+1);
  if (area === 'admin') return { area:'admin', mod };
  if (area === 'modulo') return { area:'modulo', mod };
  return { area:'hub', mod:null };
}
function consumirFoco(key){
  if (st.foco && st.foco.mod === key){ const id = st.foco.id; st.foco = null; return id; }
  return null;
}

function renderTopoUsuario(){
  const el = $('#topo-usuario');

function render(){
  if (!DB) return;
  const rota = parseHash();
  const emAdmin = rota.area === 'admin';
  $('#t-titulo').textContent = emAdmin ? 'Administração' : (DB.config.congregacao || 'Programação da congregação');
  $('#t-sub').textContent = emAdmin ? 'Manutenção das programações' : 'Escalas e designações';
  const troca = $('#troca');

  troca.href = emAdmin ? '#' : '#admin';

  else if (rota.area === 'modulo') renderModulo(rota.mod);
  else renderHub();
  document.title = emAdmin ? 'Administração · Programação' : 'Programação da congregação';
}

/* ============================================================ hub e busca global */
function cartaoHub(h){
  return `<a class="hub-card" href="#modulo:${h.key}"><span class="faixa" style="background:${h.cor}"></span><h2>${h.titulo}</h2><p>${esc(resumoModulo(h.key))}</p></a>`;
}
function resumoModulo(key){
  if (key === 'ms'){
    const ws = ordenadas(); if (!ws.length) return 'Nenhuma semana cadastrada';
    const w = ws.find(ehSemanaAtual) || ws.find(x => x.inicio > hojeIso()) || ws[ws.length-1];
    return `${rotuloCurto(w)} · ${w.presidente || 'presidente a definir'}`;
  }
  if (MODULOS_SIMPLES[key]){
    const cfg = MODULOS_SIMPLES[key], linhas = DB[cfg.tabela];
    if (!linhas.length) return 'Nenhuma data cadastrada';
    const alvo = idAtualPorCampo(linhas, 'data');
    const x = linhas.find(l => l.data === alvo);
    return `${dataCurta(alvo)} · ${x[cfg.campos[0].k] || 'a definir'}`;
  }
  if (key === 'lp'){
    const prog = DB.limpezaPeriodica.filter(x => statusPeriodica(x.data) === 'Programado').length;
    const sem = DB.limpezaSemanal.length ? `próxima em ${dataCurta(idAtualPorCampo(DB.limpezaSemanal,'data'))}` : 'sem datas ainda';
    return prog ? `${sem} · ${prog} limpeza${prog>1?'s':''} geral${prog>1?'is':''} programada${prog>1?'s':''}` : sem;
  }
  if (key === 'rm'){
    const pend = DB.relatorios.filter(r => r.status === 'Entregue').length;
    return pend ? `${pend} relatório${pend>1?'s':''} aguardando validação` : 'Nenhum relatório pendente';
  }
  return '';
}

function designacoesMS(f){
  const out = [];
  ordenadas().forEach(w => {
    if (casa(w.presidente, f)) out.push({ w, papel:'Presidente', oque:'Presidência da reunião' });
    if (casa(w.oracaoInicial, f)) out.push({ w, papel:'Oração', oque:'Oração inicial' });
    partesOrd(w).forEach(x => {
      const dir = x.tipo === 'Dirigente/leitor';
      if (casa(x.nome, f)) out.push({ w, papel: dir ? 'Dirigente' : (x.tipo.startsWith('Estudante') ? 'Estudante' : 'Designado'), oque:x.titulo });
      if (casa(x.ajudante, f)) out.push({ w, papel: dir ? 'Leitor' : 'Ajudante', oque:x.titulo });
    });
    if (casa(w.oracaoFinal, f)) out.push({ w, papel:'Oração', oque:'Oração final' });
  });
  return out;
}

function buscaGlobal(filtro){
  const f = filtro.trim(); if (f.length < 2) return [];
  const out = [];
  designacoesMS(f).forEach(d => out.push({ mod:'ms', data:d.w.inicio, papel:d.papel, oque:d.oque, rot:rotuloCurto(d.w) }));
  DB.fimDeSemana.forEach(x => {
    if (casa(x.presidente, f)) out.push({ mod:'fs', data:x.data, papel:'Presidente', oque:'Reunião de fim de semana', rot:dataCurta(x.data) });
    if (casa(x.leitor, f)) out.push({ mod:'fs', data:x.data, papel:'Leitor', oque:'Leitura de A Sentinela', rot:dataCurta(x.data) });
  });
  DB.multimidia.forEach(x => {
    if (casa(x.mesa, f)) out.push({ mod:'av', data:x.data, papel:'Mesa', oque:'Multimídia', rot:dataCurta(x.data) });
    if (casa(x.volante1, f) || casa(x.volante2, f)) out.push({ mod:'av', data:x.data, papel:'Volante', oque:'Microfone volante', rot:dataCurta(x.data) });
  });
  DB.indicadores.forEach(x => {
    if (casa(x.indicador1, f) || casa(x.indicador2, f)) out.push({ mod:'in', data:x.data, papel:'Indicador', oque:'Indicador da reunião', rot:dataCurta(x.data) });
  });
  DB.dirigentesCampo.forEach(x => {
    if (casa(x.nome, f)) out.push({ mod:'dc', data:x.data, papel:'Dirigente de campo', oque:'Dirigente de campo do fim de semana', rot:dataCurta(x.data) });
  });
  DB.limpezaSemanal.forEach(x => {
    if (casa(x.grupo, f)) out.push({ mod:'lp', data:x.data, papel:'Limpeza', oque:'Limpeza semanal do salão', rot:dataCurta(x.data) });
  });
  DB.relatorios.forEach(x => {
    if (casa(x.nome, f)) out.push({ mod:'rm', data:x.mesAno+'-01', papel:'Relatório', oque:`Relatório de ${mesAnoLegivel(x.mesAno)}`, rot:`${mesAnoLegivel(x.mesAno)} · ${x.status}` });
  });
  out.sort((a,b) => (a.data||'').localeCompare(b.data||''));
  return out;
}

/* ============================================================ roteador dos módulos (visão pública) */
function renderModulo(key){
  if (key === 'ms') return renderModuloMS();
  if (MODULOS_SIMPLES[key]) return renderModuloSimplesTela(key);
  if (key === 'lp') return renderModuloLimpeza();
  if (key === 'rm') return renderModuloRelatorios();
  location.hash = ''; render();
}

function tabelaSimplesUsuarioHTML(tabela, campos, focoId, comDiaSemana){
  const linhas = [...DB[tabela]].sort((a,b) => (a.data||'').localeCompare(b.data||''));
  if (!linhas.length) return '<p>Nada cadastrado ainda.</p>';
  const alvo = focoId || idAtualPorCampo(linhas, 'data');
  const fmtData = iso => comDiaSemana ? `${diaSemana(iso)} · ${dataCurta(iso)}` : dataCurta(iso);
  return `<div class="rolagem"><table><thead><tr><th>Data</th>${campos.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>` +
    linhas.map(x => `<tr${x.data===alvo?' class="atual"':''}><td>${fmtData(x.data)}</td>${campos.map(c => `<td>${x[c.k] ? esc(x[c.k]) : '<span class="vazio">a definir</span>'}</td>`).join('')}</tr>`).join('') +
    '</tbody></table></div>';
}

    </div>
    <div id="conteudo-ms"></div>`;
  renderConteudoMS();
}
function renderConteudoMS(){
  const alvo = $('#conteudo-ms'); if (!alvo) return;
  const ws = ordenadas();
  if (!ws.length){ alvo.innerHTML = '<div class="painel"><p>Nenhuma semana cadastrada ainda.</p></div>'; return; }
  if (!st.semana || !ws.some(w => w.id === st.semana)) st.semana = semanaPadrao(ws);
  const w = ws.find(x => x.id === st.semana);
  const f = st.filtro.trim().length >= 2 ? st.filtro.trim() : '';
  let html = '';
  if (f){
    const lista = designacoesMS(f);
    html += `<section class="minhas" aria-live="polite"><h2>${lista.length ? `${lista.length} designaç${lista.length>1?'ões':'ão'} para “${esc(f)}”` : 'Nenhuma designação'}</h2>`;
    html += lista.length
      ? `<ul>${lista.map(d => `<li><button data-acao="semana" data-id="${d.w.id}"><span class="quando">${rotuloCurto(d.w)}</span><span class="oque">${esc(d.oque)}<small>${d.papel}</small></span></button></li>`).join('')}</ul>`
      : `<p>Não há partes com esse nome nas semanas publicadas.</p>`;
    html += '</section>';
  }
  html += `<nav class="chips" aria-label="Semanas">${ws.map(x =>
    `<button class="chip" data-acao="semana" data-id="${x.id}" aria-pressed="${x.id===w.id}">${rotuloCurto(x)}${ehSemanaAtual(x)?'<span class="agora" title="Semana atual"></span>':''}</button>`).join('')}</nav>`;
  html += cartaoSemanaMS(w, f);
  alvo.innerHTML = html;
  const ativo = alvo.querySelector('.chip[aria-pressed="true"]');
  ativo && ativo.scrollIntoView({ block:'nearest', inline:'center' });
}
function cartaoSemanaMS(w, f){
  const nm = n => !n ? '<span class="vazio">a definir</span>' : (f && casa(n,f) ? `<mark>${esc(n)}</mark>` : esc(n));
  const tem = (...ns) => f && ns.some(n => casa(n,f));
  let n = 0;
  const linhaParte = x => {
    n++;
    const nomes = x.ajudante ? `${nm(x.nome)} / ${nm(x.ajudante)}` : nm(x.nome);
    return `<div class="parte${tem(x.nome,x.ajudante)?' hl':''}">
      <span class="num">${n}</span>
      <span class="tit">${esc(x.titulo) || '<span class="vazio">Título a definir</span>'}</span>
      <span class="min">${x.min ? x.min + ' min' : ''}</span>
      <span class="quem">${x.tipo ? `<span class="papel">${esc(x.tipo)}</span>` : ''}<span class="nomes">${nomes}</span></span>
    </div>`;
  };
  const bloco = s => {
    const ps = w.partes.filter(x => x.secao === s);
    let h = `<section class="bloco b-${s}"><h3>${SECOES[s]}</h3>`;
    if (s === 'V' && w.canticoMeio) h += `<div class="simples"><span>Cântico de transição ${esc(w.canticoMeio)}</span><span></span></div>`;
    h += ps.map(linhaParte).join('');
    if (s === 'V'){
      h += `<div class="simples"><span>Comentários finais</span><span>3 min</span></div>`;
      h += `<div class="parte${tem(w.oracaoFinal)?' hl':''}"><span class="num" aria-hidden="true" style="border-style:dotted"></span><span class="tit">Cântico ${esc(w.canticoFinal)||'—'} e oração</span><span class="min"></span><span class="quem"><span class="papel">Oração</span><span class="nomes">${nm(w.oracaoFinal)}</span></span></div>`;
    }
    return h + '</section>';
  };
  return `<article class="semana">
    <header class="sem-cab"><div><h2>${rotuloLongo(w)}</h2><p>${esc(w.textoBiblico) || 'Texto bíblico a definir'}</p></div><span class="data-reuniao">${dataDDMMAAAA(w.inicio)}</span></header>
    <div class="equipe">
      <div class="${tem(w.presidente)?'hl':''}"><small>Presidente</small><b>${nm(w.presidente)}</b></div>
      <div class="${tem(w.oracaoInicial)?'hl':''}"><small>Oração inicial</small><b>${nm(w.oracaoInicial)}</b></div>
    </div>
    <div class="simples"><span>Cântico ${esc(w.canticoInicial)||'—'} e oração</span><span></span></div>
    <div class="simples"><span>Comentários iniciais</span><span>1 min</span></div>
    ${['T','M','V'].map(bloco).join('')}
  </article>`;
}

function mover(i, dir){
  const P = st.draft.partes, s = P[i].secao;
  let j = i + dir;
  while (j >= 0 && j < P.length && P[j].secao !== s) j += dir;
  if (j < 0 || j >= P.length) return;
  [P[i], P[j]] = [P[j], P[i]];
}
function novaSemana(){
  const ws = ordenadas(), base = ws[ws.length-1];
  let inicio;
  if (base) inicio = somaDias(base.inicio, 7);
  else { const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); inicio = paraIso(d); }
  const partes = (base ? base.partes : MODELO_PARTES_MS).map(x => ({ ...x, nome:'', ajudante:'', titulo: /joias|leitura|estudo b|iniciando|cultivando|explicando/i.test(x.titulo) ? x.titulo : '' }));
  st.draft = { id:null, inicio, fim:somaDias(inicio,6), textoBiblico:'', presidente:'', oracaoInicial:'', oracaoFinal:'', canticoInicial:'', canticoMeio:'', canticoFinal:'', partes };
  st.editId = null;
  render(); window.scrollTo(0,0);
}
async function salvarSemanaMS(b){
  const d = st.draft;
  if (!d.inicio){ toast('Escolha a data de início da semana'); return; }
  if (DB.semanasMS.some(w => w.id === d.inicio && w.id !== st.editId)){ toast('Já existe uma semana começando nessa data'); return; }
  const w = { ...d, id:d.inicio, fim:somaDias(d.inicio,6),
    partes: d.partes.map(x => ({ ...x, titulo:x.titulo.trim(), nome:x.nome.trim(), ajudante:x.tipo.includes('/') ? x.ajudante.trim() : '', min:Number(x.min)||0 })) };
  DB.semanasMS = DB.semanasMS.filter(x => x.id !== st.editId && x.id !== w.id);
  DB.semanasMS.push(w);
  if (b) b.disabled = true;
  try {
    await Dados.salvar();
    st.draft = null; st.editId = null; st.semana = w.id;
    render(); window.scrollTo(0,0);
    toast('Semana salva');
  } catch (err) {
    toast('Não foi possível salvar: ' + err.message);
  } finally {
    if (b) b.disabled = false;
  }
}

/* ============================================================ eventos */
// Salva o estado atual de DB na planilha, com feedback de sucesso/erro e
// o botão desabilitado durante a chamada, evitando duplo clique.
function salvarComFeedback(b, msgOk, reRender){
  if (b) b.disabled = true;
  Dados.salvar().then(() => {
    if (reRender) render();
    toast(msgOk);
  }).catch(err => {
    toast('Não foi possível salvar: ' + err.message);
  }).finally(() => { if (b) b.disabled = false; });
}

function manipularCampoTabela(t){
  const val = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.tab !== undefined){ DB[t.dataset.tab][Number(t.dataset.i)][t.dataset.k] = val; return true; }
  if (t.dataset.tabp !== undefined){ DB.limpezaPeriodica[Number(t.dataset.tabp)][t.dataset.k] = val; return true; }
  if (t.dataset.rid !== undefined){
    const r = DB.relatorios.find(x => x.id === t.dataset.rid); if (!r) return true;
    if (t.dataset.k === 'tipo'){ r.tipo = val; if (val === 'Publicador') r.horaCampo = ''; render(); return true; }
    r[t.dataset.k] = val; return true;
  }
  return false;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-acao]'); if (!b) return;
  const a = b.dataset.acao, id = b.dataset.id, i = Number(b.dataset.i);
  switch (a){
    case 'foco': st.foco = { mod:b.dataset.mod, id:b.dataset.id }; if (b.dataset.mod === 'ms') st.semana = b.dataset.id; break;
    case 'semana': st.semana = id; renderConteudoMS(); if (b.closest('.minhas')) document.querySelector('.semana')?.scrollIntoView({ behavior:'smooth', block:'start' }); break;
    case 'limpar': if (!st.usuario){ st.filtro = ''; renderModuloMS(); } break;
    case 'limpar-hub': st.filtroHub = ''; renderHub(); break;
    case 'login-usuario': renderLoginUsuario(); break;
    case 'confirmar-login-usuario': {
      const nome = ($('#u-nome')||{}).value;
      const pin  = ($('#u-pin')||{}).value;
      if (!nome){ toast('Selecione seu nome'); break; }
      if (!pin){ toast('Digite o PIN'); break; }
      const pessoa = DB.pessoas.find(x => x.nome === nome);
      if (!pessoa){ toast('Nome não encontrado'); break; }
      // Primeiro acesso — PIN inicial em texto puro
      if (pessoa.pinInicial && String(pessoa.pinInicial).trim() === String(pin).trim()){
        renderCriarPin(nome); break;
      }
      // PIN pessoal — compara o hash
      b.disabled = true;
      hashPin(pin).then(h => {
        if (pessoa.pin && pessoa.pin === h){
          st.usuario = nome; sessaoUsuario(nome);
          st.filtroHub = nome;
          location.hash = '';
          render();
          toast('Bem-vindo(a), ' + nome.split(' ')[0] + '!');
        } else {
          toast('PIN incorreto. Fale com o administrador.');
          const el = $('#u-pin'); if (el){ el.value = ''; el.focus(); }
        }
      }).finally(() => { b.disabled = false; });
      break; }
    case 'salvar-pin-novo': {
      const nome = b.dataset.nome;
      const pinNovo = ($('#pin-novo')||{}).value;
      const pinConf = ($('#pin-conf')||{}).value;
      if (!pinNovo || pinNovo.length < 4){ toast('Digite um PIN de 4 dígitos'); break; }
      if (pinNovo !== pinConf){ toast('Os PINs não coincidem'); break; }
      b.disabled = true;
      hashPin(pinNovo).then(h => {
        // Grava o hash (não o PIN em texto) na planilha
        return fetch(API_URL, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({ acao:'trocarPin', nome, pinHash: h })
        }).then(r=>r.json());
      }).then(j => {
        if (j.ok){
          // Atualiza localmente com o hash
          const pessoa = DB.pessoas.find(x => x.nome === nome);
          if (pessoa){ pessoa.pin = j.pinHash||''; pessoa.pinInicial = ''; }
          st.usuario = nome; sessaoUsuario(nome);
          st.filtroHub = nome;
          location.hash = '';
          render();
          toast('PIN criado! Bem-vindo(a), ' + nome.split(' ')[0] + '!');
        } else { toast('Erro ao salvar PIN: ' + (j.erro||'tente de novo')); }
      }).catch(()=>toast('Não foi possível salvar o PIN. Tente de novo.')).finally(()=>{ b.disabled = false; });
      break; }
    case 'continuar-sem-login': location.hash = ''; render(); break;
    case 'sair-usuario': st.usuario = ''; st.filtroHub = ''; sessaoUsuario(''); render(); break;
    case 'login': {
      const pin = $('#pin').value.trim();
      const r = checarPin(pin);
      if (r){ st.escopo = r; st.pin = pin; sessaoEscopo(r); sessaoPin(pin); location.hash = r === 'todos' ? '#admin' : '#admin:' + r; render(); }
      else { toast('PIN incorreto'); $('#pin').select(); }
      break; }
    case 'sair': st.escopo = ''; st.pin = ''; sessaoEscopo(''); sessaoPin(''); location.hash = ''; break;
    case 'nova': novaSemana(); break;
    case 'editar': st.editId = id; st.draft = JSON.parse(JSON.stringify(DB.semanasMS.find(w => w.id === id))); render(); window.scrollTo(0,0); break;
    case 'excluir': { const w = DB.semanasMS.find(x => x.id === id);
      if (w && confirm(`Excluir a semana de ${rotuloLongo(w)}?`)){ DB.semanasMS = DB.semanasMS.filter(x => x.id !== id); salvarComFeedback(b, 'Semana excluída', true); }
      break; }
    case 'adicionar': { const P = st.draft.partes, s = b.dataset.s;
      const ult = P.map(x => x.secao).lastIndexOf(s);
      const pos = ult >= 0 ? ult + 1 : (s === 'T' ? 0 : s === 'M' ? P.filter(x => x.secao === 'T').length : P.length);
      P.splice(pos, 0, p(s, '', s === 'M' ? 3 : 10, s === 'M' ? 'Estudante/ajudante' : '', ''));
      render(); document.getElementById(`p${pos}t`)?.focus(); break; }
    case 'remover': st.draft.partes.splice(i,1); render(); break;
    case 'sobe': mover(i,-1); render(); break;
    case 'desce': mover(i,1); render(); break;
    case 'cancelar': st.draft = null; st.editId = null; render(); break;
    case 'salvar': salvarSemanaMS(b); break;
    case 'salvar-config': { const pin = $('#cfg-pin').value.trim();
      if (pin.length < 4){ toast('Use um PIN mestre com pelo menos 4 dígitos'); break; }
      DB.config.congregacao = $('#cfg-nome').value.trim(); DB.config.pinMestre = pin;
      HUB_DEFS.forEach(h => { const el = $('#cfg-pin-'+h.key); if (el) DB.config.pins[h.key] = el.value.trim(); });
      salvarComFeedback(b, 'Configurações salvas', true); break; }
    case 'add-pessoa': { const prox = DB.pessoas.length ? Math.max(...DB.pessoas.map(x => x.id)) + 1 : 1; DB.pessoas.push({ id:prox, nome:'', grupo:'', pin:'', podePresidente:false, podeDirigenteEstudo:false, podeVolante:false, podeIndicador:false, podeMesa:false, podeLeitorSentinela:false, podeLeitorEstudo:false }); render(); break; }
    case 'add-linha': DB[b.dataset.tab].push(linhaVaziaTabela(b.dataset.tab)); render(); break;
    case 'remover-linha': DB[b.dataset.tab].splice(i,1); render(); break;
    case 'salvar-tabela': salvarComFeedback(b, 'Alterações salvas', false); break;
    case 'add-periodica': DB.limpezaPeriodica.push({ data:'', observacoes:'' }); render(); break;
    case 'remover-periodica': DB.limpezaPeriodica.splice(i,1); render(); break;
    case 'salvar-periodica': salvarComFeedback(b, 'Alterações salvas', false); break;
    case 'alternar-status': { const r = DB.relatorios.find(x => x.id === b.dataset.rid); if (r){ r.status = r.status === 'Validado' ? 'Entregue' : 'Validado'; salvarComFeedback(b, 'Status atualizado', true); } break; }
    case 'salvar-relatorios': salvarComFeedback(b, 'Alterações salvas', false); break;
    case 'enviar-relatorio': {
      // Quando logado, o campo mês é um input readonly — pegar o valor atual
      const mesEl = $('#rl-mes');
      const mesAno = (mesEl && mesEl.value) ? mesEl.value : mesAtualISO();
      // Nome: se logado usa st.usuario; senão usa o select
      const nomeEl = $('#rl-nome');
      const nome = st.usuario || (nomeEl && nomeEl.value) || '';
      const mesAtual = mesAtualISO();
      if (!nome){ toast('Selecione o seu nome'); break; }
      if (mesAno !== mesAtual){ toast('Só é possível enviar o relatório do mês atual.'); break; }
      const tipoEl = document.querySelector('input[name="rl-tipo"]:checked');
      const tipo = tipoEl ? tipoEl.value : 'Publicador';
      const horaCampo = tipo !== 'Publicador' ? (Number($('#rl-horas').value)||0) : '';
      const estudos = $('#rl-estudos').value ? Number($('#rl-estudos').value) : '';
      const registro = { mesAno, nome, tipo, horaCampo, estudos };
      b.disabled = true;
      Dados.enviarRelatorio(registro).then(() => {
        const idr = mesAno + '|' + norm(nome);
        const existente = DB.relatorios.find(r => r.id === idr);
        if (existente) Object.assign(existente, { nome, tipo, horaCampo, estudos, status:'Entregue' });
        else DB.relatorios.push({ id:idr, mesAno, nome, tipo, horaCampo, estudos, status:'Entregue' });
        toast(existente ? 'Relatório atualizado' : 'Relatório enviado');
        atualizarMeusRelatorios();
      }).catch(err => {
        toast('Não foi possível enviar: ' + err.message);
      }).finally(() => { b.disabled = false; });
      break; }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (manipularCampoTabela(t)) return;
  if (t.id === 'busca'){
    const tinha = !!st.filtro; st.filtro = t.value;
    if (tinha !== !!st.filtro){ const pos = t.selectionStart; renderModuloMS(); const nb = $('#busca'); nb.focus(); nb.setSelectionRange(pos,pos); }
    else renderConteudoMS();
    return;
  }
  if (t.id === 'busca-hub'){ st.filtroHub = t.value; renderResultadoHub(); return; }
  if (t.id === 'rl-nome'){ atualizarMeusRelatorios(); return; }
  if (!st.draft) return;
  if (t.dataset.f){
    st.draft[t.dataset.f] = t.value;
    if (t.dataset.f === 'inicio' && t.value){ const dica = $('#dica-fim'); if (dica) dica.textContent = 'Vai até ' + rotuloLongo({inicio:t.value, fim:somaDias(t.value,6)}).split(' a ')[1]; }
  } else if (t.dataset.k && t.dataset.k !== 'tipo' && t.dataset.i !== undefined){
    st.draft.partes[Number(t.dataset.i)][t.dataset.k] = t.value;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (manipularCampoTabela(t)) return;
  if (t.name === 'rl-tipo'){ atualizarCampoHoras(); return; }
  if (t.id === 'rl-nome'){ atualizarMeusRelatorios(); return; }
  if (t.id === 'mes-adm'){ st.mesAdmin = t.value; renderAdminRelatorios(); return; }
  if (st.draft && t.tagName === 'SELECT' && t.dataset.k === 'tipo' && t.dataset.i !== undefined){
    st.draft.partes[Number(t.dataset.i)].tipo = t.value; render();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'pin') document.querySelector('[data-acao="login"]').click();
});

window.addEventListener('hashchange', () => { st.draft = null; st.editId = null; render(); window.scrollTo(0,0); });

/* ============================================================ carregamento inicial */
async function iniciar(){
  $('#app').innerHTML = `<div class="painel" style="text-align:center;padding:32px 16px">
    <div style="font-size:36px;margin-bottom:12px;animation:spin 1.2s linear infinite;display:inline-block">⏳</div>
    <p style="font-weight:700;margin:0 0 6px">Carregando dados…</p>
    <p style="color:var(--muted);font-size:14px;margin:0">A primeira abertura pode levar alguns segundos.</p>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
  try {
    DB = await Dados.carregar();
    render();
  } catch (err) {
    $('#app').innerHTML = `<div class="painel"><h2>Não foi possível carregar os dados</h2>
      <p style="color:var(--muted)">${esc(err.message)}</p>
      <button class="btn pri" data-acao="tentar-de-novo">Tentar de novo</button></div>`;
  }
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-acao="tentar-de-novo"]')) iniciar();
});
iniciar();

// ---- Service Worker ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ---- PWA Install Modal ----
let _pwaEvt = null;
const PWA_KEY = 'pwa-dispensado';

function mostrarModalPWA() {
  if (localStorage.getItem(PWA_KEY)) return;
  const m = document.getElementById('pwa-modal');
  if (m) m.style.display = 'flex';
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaEvt = e;
  // Aguarda o app carregar antes de exibir o modal
  setTimeout(mostrarModalPWA, 800);
});

document.addEventListener('click', e => {
  if (e.target.id === 'btn-pwa-instalar' && _pwaEvt) {
    _pwaEvt.prompt();
    _pwaEvt.userChoice.then(() => {
      _pwaEvt = null;
      document.getElementById('pwa-modal').style.display = 'none';
      localStorage.setItem(PWA_KEY, '1');
    });
  }
  if (e.target.id === 'btn-pwa-fechar') {
    document.getElementById('pwa-modal').style.display = 'none';
    localStorage.setItem(PWA_KEY, '1');
  }
});

window.addEventListener('appinstalled', () => {
  const m = document.getElementById('pwa-modal');
  if (m) m.style.display = 'none';
  localStorage.setItem(PWA_KEY, '1');
});
</script>
